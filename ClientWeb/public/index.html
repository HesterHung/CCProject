<!DOCTYPE html>
<html>
<head>
    <title>Hybrid Cloud Gaming Client</title>
    <style>
        body { 
            background: #1e1e1e; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; margin: 0; padding-top: 20px;
        }
        .container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        video { 
            width: 80%; max-width: 1280px; aspect-ratio: 16/9; background: #000; border: 3px solid #333; 
            /* This is Innovation 3: Dynamic State A (0ms cost linear scaling) */
            /* We will programmatically toggle this in the JS later */
            image-rendering: -webkit-optimize-contrast; 
        }

        #dashboard {
            display: flex; width: 80%; max-width: 1280px; gap: 10px;
        }

        .panel {
            background: #2a2a2a; border-radius: 8px; padding: 15px; flex: 1; text-align: left;
        }

        .metric-value { font-size: 1.5em; font-weight: bold; color: #4CAF50; }
        
        #log-area {
            height: 150px; overflow-y: auto; background: #000; padding: 10px; font-family: monospace; font-size: 0.9em;
            color: #aaa; border-radius: 5px; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hybrid Upscaling Architecture - WebRTC Client</h2>
        
        <video id="gameVideo" autoplay playsinline muted></video>

        <div id="dashboard">
            <div class="panel">
                <h3>Current Engine Motion: <span id="m_score" class="metric-value">0.00</span></h3>
                Linear Vel: <span id="m_linear">0</span><br>
                Angular Vel: <span id="m_angular">0</span>
            </div>
            <div class="panel">
                <h3>WebRTC Performance</h3>
                Latency (Jitter): <span id="s_jitter" class="metric-value">0 ms</span><br>
                Decode Time: <span id="s_decode" class="metric-value">0 ms</span><br>
                Resolution: <span id="s_res">0x0</span> (<span id="s_fps">0</span> fps)
            </div>
            <div class="panel">
                <h3>Debug Log</h3>
                <div id="log-area">Ready...<br></div>
            </div>
        </div>

        <button id="captureBtn" style="padding: 10px 20px; font-size: 16px; background-color: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">
            📸 Capture Frame for SSIM Analysis
        </button>
        <canvas id="snapshotCanvas" style="display:none;"></canvas>
    </div>

    <script>
        const YOUR_AWS_PUBLIC_IP = "3.80.165.210"; // <-- REPLACE THIS WITH YOUR ACTUAL PUBLIC IP ADDRESS
        const video = document.getElementById('gameVideo');
        const logArea = document.getElementById('log-area');
        const ws = new WebSocket(`ws://${YOUR_AWS_PUBLIC_IP}:8080`);
        
        function log(text) {
            console.log(text);
            logArea.innerHTML += `${text}<br>`;
            logArea.scrollTop = logArea.scrollHeight; // Auto-scroll
        }

        let pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });

        // 1. Listen for the Video Stream
        pc.ontrack = (event) => {
            log("📺 Received Video Track from Unity!");
            if (event.streams && event.streams.length > 0) {
                video.srcObject = event.streams[0];
            } else {
                let stream = new MediaStream([event.track]);
                video.srcObject = stream;
            }
        };

        // 2. Transmit networking candidate data to Unity
        pc.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({ 
                    type: 'candidate', 
                    candidate: event.candidate.candidate, 
                    sdpMid: event.candidate.sdpMid, 
                    sdpMLineIndex: event.candidate.sdpMLineIndex 
                }));
            }
        };

        // ====================================================
        // HYSTERESIS STATE AND LOGIC
        // ====================================================
        let isHighFidelityState = true;
        
        // Tuning thresholds based on Unity's MotionAnalyzer
        const THRESHOLD_HIGH_MOTION = 25.0; // Sprinting/rapid turns -> switch to fast scaling
        const THRESHOLD_RESTORE_AI = 10.0;  // Settled -> restore quality scaler

        function enableLowLatencyState() {
            if (!isHighFidelityState) return;
            isHighFidelityState = false;
            
            // State A: Linear Scaling (Simulating 0ms latency cost)
            video.style.imageRendering = 'auto'; 
            video.style.filter = 'blur(1px)'; // Exaggerated blur so you visually see it working in this prototype
            
            log("⚡ [Hysteresis] High-Motion! Downgrading to Zero-Latency Linear Scaling.");
        }

        function enableHighFidelityState() {
            if (isHighFidelityState) return;
            isHighFidelityState = true;
            
            // State B: High Fidelity AI (Simulating max quality)
            video.style.imageRendering = '-webkit-optimize-contrast';
            video.style.filter = 'saturate(1.2) contrast(1.1)'; // Visual indicators for 'Fidelity'
            
            log("✨ [Hysteresis] Scene settled. Restoring High-Fidelity Upscaling.");
        }

        // 3. Listen for Data Channel (Innovation 2)
        pc.ondatachannel = (event) => {
            const receiveChannel = event.channel;
            receiveChannel.onopen = () => log("📡 Motion Data Channel Opened Successfully!");
            
            receiveChannel.onmessage = (e) => {
                const data = JSON.parse(e.data);
                
                // Update the Dashboard Metrics natively 60 times a second
                document.getElementById('m_score').innerText = data.motionScore;
                document.getElementById('m_linear').innerText = data.linearVel;
                document.getElementById('m_angular').innerText = data.angularVel;

                // INNOVATION 3: The Dynamic Hysteresis Controller
                if (data.motionScore > THRESHOLD_HIGH_MOTION) {
                    enableLowLatencyState();
                } else if (data.motionScore < THRESHOLD_RESTORE_AI) {
                    enableHighFidelityState();
                }
            };
        };

        // 4. WebSocket Signaling Message Handler
        ws.onopen = () => log("🔗 Connected to Node.js Signaling Server");
        
        let remoteDescriptionSet = false;
        let candidateQueue = [];

        ws.onmessage = async (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === 'offer') {
                log("📩 Received WebRTC Offer from Unity Server");
                
                // Set remote, then generate Answer
                await pc.setRemoteDescription(new RTCSessionDescription(msg));
                remoteDescriptionSet = true;

                while (candidateQueue.length > 0) {
                    await pc.addIceCandidate(new RTCIceCandidate(candidateQueue.shift()));
                }

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                
                log("📫 Sending WebRTC Answer back to Unity");
                ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
            } 
            else if (msg.type === 'candidate') {
                if (remoteDescriptionSet) {
                    await pc.addIceCandidate(new RTCIceCandidate(msg)).catch(e => console.error(e));
                } else {
                    candidateQueue.push(msg);
                }
            }
        };

        // ====================================================
        // EVALUATION METRICS: LATENCY & PERFORMANCE POLLING
        // ====================================================
        setInterval(async () => {
            if (!pc || pc.connectionState !== 'connected') return;

            const stats = await pc.getStats();
            let fps = 0;
            let width = 0; let height = 0;
            let jitter = 0;
            let decodeTime = 0;

            stats.forEach(report => {
                if (report.type === 'inbound-rtp' && report.kind === 'video') {
                    fps = report.framesPerSecond || 0;
                    width = report.frameWidth || 0;
                    height = report.frameHeight || 0;
                    jitter = (report.jitter || 0) * 1000; // convert to ms
                    
                    // Estimate per-frame decode time based on total decoded frames
                    if (report.framesDecoded && report.totalDecodeTime) {
                        decodeTime = (report.totalDecodeTime / report.framesDecoded) * 1000;
                    }
                }
            });

            document.getElementById('s_fps').innerText = Math.round(fps);
            document.getElementById('s_res').innerText = `${width}x${height}`;
            document.getElementById('s_jitter').innerText = `${jitter.toFixed(1)} ms`;
            document.getElementById('s_decode').innerText = `${decodeTime.toFixed(2)} ms`;
        }, 1000); // Poll WebRTC stats every 1 second

        // ====================================================
        // EVALUATION METRICS: SSIM SNAPSHOT CAPTURE
        // ====================================================
        const captureBtn = document.getElementById('captureBtn');
        const snapshotCanvas = document.getElementById('snapshotCanvas');

        function triggerSnapshot() {
            if (video.videoWidth === 0) return;
            
            // Set canvas to internal video resolution (ignoring CSS scaling)
            snapshotCanvas.width = video.videoWidth;
            snapshotCanvas.height = video.videoHeight;
            
            const ctx = snapshotCanvas.getContext('2d');
            ctx.drawImage(video, 0, 0, snapshotCanvas.width, snapshotCanvas.height);
            
            // Auto-trigger Download
            const dataURL = snapshotCanvas.toDataURL('image/png');
            const link = document.createElement('a');
            
            // Name file including current Hysteresis State for easy sorting!
            const stateStr = isHighFidelityState ? "HighFidelity_AI" : "LowLatency_Linear";
            link.download = `frame_${Date.now()}_${stateStr}.png`;
            link.href = dataURL;
            link.click();
            
            log(`📸 Captured ${snapshotCanvas.width}x${snapshotCanvas.height} reference frame explicitly tagged as [${stateStr}]`);
        }

        // Allow manual button clicks for targeted testing
        captureBtn.addEventListener('click', triggerSnapshot);

        // ----------------------------------------------------
        // 5. Input Bridge (Keyboard & Mouse)
        // ----------------------------------------------------
        
        // Prevent right-click menu from stopping gameplay when aiming
        document.addEventListener('contextmenu', event => event.preventDefault());

        document.addEventListener('keydown', (e) => {
            // Prevent the browser from scrolling down when pressing "Space" to jump
            if (e.code === 'Space' || e.code === 'Tab') {
                e.preventDefault();
            }
            ws.send(JSON.stringify({ type: 'input', keyType: 'keydown', key: e.code }));
        });
        document.addEventListener('keyup', (e) => {
            if (e.code === 'Space' || e.code === 'Tab') {
                e.preventDefault();
            }
            ws.send(JSON.stringify({ type: 'input', keyType: 'keyup', key: e.code }));
        });
        
        // Relative mouse movements for 3D Camera control
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement) {
                ws.send(JSON.stringify({ type: 'input', keyType: 'mousemove', moveX: e.movementX, moveY: e.movementY }));
            }
        });

        // Absolute mouse movements for 2D UI pointer hover and clicks over the video element
        video.addEventListener('mousemove', (e) => {
            if (!document.pointerLockElement) {
                const rect = video.getBoundingClientRect();
                const u = (e.clientX - rect.left) / rect.width;
                const v = 1.0 - ((e.clientY - rect.top) / rect.height); // Flip Y to match Unity coordinate space (0,0 is bottom-left)
                ws.send(JSON.stringify({ type: 'input', keyType: 'mousemove_abs', absX: u, absY: v }));
            }
        });

        document.addEventListener('mousedown', (e) => {
            // Lock the mouse to the game screen like a real FPS or allow UI interaction
            if (!document.pointerLockElement) video.requestPointerLock();
            ws.send(JSON.stringify({ type: 'input', keyType: 'mousedown', button: e.button }));
        });
        document.addEventListener('mouseup', (e) => {
            ws.send(JSON.stringify({ type: 'input', keyType: 'mouseup', button: e.button }));
        });

    </script>
</body>
</html>
